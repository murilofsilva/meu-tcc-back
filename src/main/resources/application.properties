spring.application.name=SchoolLab Manager

# Active Profile (dev or prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Configuration
jwt.secret=${JWT_SECRET:my-secret-key-for-jwt-token-generation-change-this-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Seed de dados de demonstração (DemoDataSeeder).
# É idempotente: só popula quando o diretor demo ainda não existe (roda 1x por base).
# Defina como false (env: APP_SEED_DEMO_ENABLED=false) para desligar completamente.
app.seed.demo.enabled=${APP_SEED_DEMO_ENABLED:true}
